<!doctype html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>کنترل ربات</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <main>
    <h1>کنترل دستی ربات‌ها</h1>
    <p class="hint">سرعت هر موتور از -10 تا 10 است.</p>

    <div class="robots">
      <section class="robot" data-robot="1">
        <h2>ربات ۱</h2>
        <div class="pad">
          <button data-l="-10" data-r="10">↶</button>
          <button data-l="10" data-r="10">▲</button>
          <button data-l="10" data-r="-10">↷</button>
          <button data-l="-10" data-r="10">◀</button>
          <button class="stop" data-l="0" data-r="0">■</button>
          <button data-l="10" data-r="-10">▶</button>
          <button data-l="-10" data-r="-10">▼</button>
          <button data-l="10" data-r="-10">↷</button>
          <button data-l="-10" data-r="10">↶</button>
        </div>
        <div class="values">چپ: <b class="left">0</b> | راست: <b class="right">0</b></div>
      </section>

      <section class="robot" data-robot="2">
        <h2>ربات ۲</h2>
        <div class="pad">
          <button data-l="-10" data-r="10">↶</button>
          <button data-l="10" data-r="10">▲</button>
          <button data-l="10" data-r="-10">↷</button>
          <button data-l="-10" data-r="10">◀</button>
          <button class="stop" data-l="0" data-r="0">■</button>
          <button data-l="10" data-r="-10">▶</button>
          <button data-l="-10" data-r="-10">▼</button>
          <button data-l="10" data-r="-10">↷</button>
          <button data-l="-10" data-r="10">↶</button>
        </div>
        <div class="values">چپ: <b class="left">0</b> | راست: <b class="right">0</b></div>
      </section>

      <section class="robot" data-robot="3">
        <h2>ربات ۳</h2>
        <div class="pad">
          <button data-l="-10" data-r="10">↶</button>
          <button data-l="10" data-r="10">▲</button>
          <button data-l="10" data-r="-10">↷</button>
          <button data-l="-10" data-r="10">◀</button>
          <button class="stop" data-l="0" data-r="0">■</button>
          <button data-l="10" data-r="-10">▶</button>
          <button data-l="-10" data-r="-10">▼</button>
          <button data-l="10" data-r="-10">↷</button>
          <button data-l="-10" data-r="10">↶</button>
        </div>
        <div class="values">چپ: <b class="left">0</b> | راست: <b class="right">0</b></div>
      </section>
    </div>

    <button id="stopAll">توقف همه ربات‌ها</button>
    <div id="status">متصل</div>
  </main>
  <script src="/static/app.js"></script>
</body>
</html>
