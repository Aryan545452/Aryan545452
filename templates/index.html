<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>RCJ Soccer Cheat</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            font-family: Arial, Tahoma, sans-serif;
            background:
                radial-gradient(circle at top, #26324a 0%, #111522 38%, #090c13 100%);
            color: #fff;
        }

        .top {
            text-align: center;
            padding: 35px 15px 25px;
        }

        .brand {
            display: inline-block;
            padding: 7px 15px;
            border-radius: 30px;
            background: rgba(255,255,255,.08);
            border: 1px solid rgba(255,255,255,.1);
            color: #aeb9d2;
            font-size: 13px;
            letter-spacing: 1px;
        }

        h1 {
            margin: 15px 0 7px;
            font-size: 38px;
        }

        .subtitle {
            margin: 0;
            color: #9da7bb;
            font-size: 15px;
        }

        .panel {
            width: 94%;
            max-width: 1250px;
            margin: auto;
            padding-bottom: 40px;
        }

        .robots {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 22px;
        }

        .robot-card {
            position: relative;
            overflow: hidden;
            background: rgba(24,29,42,.88);
            border: 1px solid rgba(255,255,255,.08);
            border-radius: 24px;
            padding: 23px;
            box-shadow: 0 18px 45px rgba(0,0,0,.28);
            backdrop-filter: blur(12px);
        }

        .robot-card::before {
            content: "";
            position: absolute;
            width: 130px;
            height: 130px;
            border-radius: 50%;
            background: rgba(85,140,255,.12);
            top: -70px;
            left: -50px;
        }

        .robot-head {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 20px;
        }

        .robot-name {
            font-size: 23px;
            font-weight: bold;
        }

        .online {
            font-size: 12px;
            padding: 7px 11px;
            border-radius: 20px;
            background: rgba(49,210,120,.12);
            color: #55e69a;
            border: 1px solid rgba(49,210,120,.2);
        }

        .controller {
            direction: ltr;
            display: grid;
            grid-template-columns: 78px 78px 78px;
            grid-template-rows: 65px 65px 65px;
            gap: 9px;
            justify-content: center;
        }

        .btn {
            border: 0;
            border-radius: 17px;
            background: #252c3c;
            color: white;
            font-size: 29px;
            cursor: pointer;
            box-shadow:
                inset 0 1px rgba(255,255,255,.06),
                0 7px 16px rgba(0,0,0,.2);
            transition: .12s;
        }

        .btn:hover {
            background: #313a4e;
            transform: translateY(-2px);
        }

        .btn:active {
            transform: scale(.93);
        }

        .up {
            grid-column: 2;
            grid-row: 1;
        }

        .left {
            grid-column: 1;
            grid-row: 2;
        }

        .stop {
            grid-column: 2;
            grid-row: 2;
            background: #a52d38;
            font-size: 14px;
            font-weight: bold;
        }

        .stop:hover {
            background: #c13845;
        }

        .right {
            grid-column: 3;
            grid-row: 2;
        }

        .down {
            grid-column: 2;
            grid-row: 3;
        }

        .values {
            direction: ltr;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-top: 20px;
        }

        .value-box {
            background: #10141e;
            border: 1px solid rgba(255,255,255,.06);
            border-radius: 14px;
            padding: 12px;
            text-align: center;
        }

        .value-title {
            display: block;
            color: #7f899e;
            font-size: 11px;
            margin-bottom: 5px;
        }

        .value-number {
            font-size: 22px;
            font-weight: bold;
        }

        .global-stop {
            display: block;
            width: min(400px, 100%);
            margin: 28px auto 0;
            padding: 17px;
            border: 0;
            border-radius: 17px;
            background: linear-gradient(135deg, #b52c38, #7d2029);
            color: white;
            font-size: 17px;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 12px 28px rgba(0,0,0,.3);
            transition: .15s;
        }

        .global-stop:hover {
            transform: translateY(-2px);
        }

        .footer {
            text-align: center;
            color: #626b7d;
            font-size: 12px;
            padding: 5px 0 25px;
        }

        @media (max-width: 900px) {
            .robots {
                grid-template-columns: 1fr;
                max-width: 520px;
                margin: auto;
            }

            h1 {
                font-size: 31px;
            }
        }

        @media (max-width: 400px) {
            .controller {
                grid-template-columns: 68px 68px 68px;
                grid-template-rows: 60px 60px 60px;
            }
        }
    </style>
</head>

<body>

<div class="top">
    <div class="brand">RCJ SOCCER CHEAT</div>

    <h1>کنترل ربات های زرد</h1>

    <p class="subtitle">
        کنترل آنلاین ربات‌های RCJ Soccer
    </p>
</div>

<div class="panel">

    <div class="robots">

        <!-- ROBOT 1 -->
        <div class="robot-card">

            <div class="robot-head">
                <div class="robot-name">🤖 Robot 1</div>
                <div class="online">● Online</div>
            </div>

            <div class="controller">

                <button class="btn up"
                    onclick="sendCommand(1, 10, 10)">
                    ↑
                </button>

                <button class="btn left"
                    onclick="sendCommand(1, -10, 10)">
                    ←
                </button>

                <button class="btn stop"
                    onclick="sendCommand(1, 0, 0)">
                    STOP
                </button>

                <button class="btn right"
                    onclick="sendCommand(1, 10, -10)">
                    →
                </button>

                <button class="btn down"
                    onclick="sendCommand(1, -10, -10)">
                    ↓
                </button>

            </div>

            <div class="values">
                <div class="value-box">
                    <span class="value-title">LEFT MOTOR</span>
                    <span class="value-number" id="left1">0</span>
                </div>

                <div class="value-box">
                    <span class="value-title">RIGHT MOTOR</span>
                    <span class="value-number" id="right1">0</span>
                </div>
            </div>

        </div>


        <!-- ROBOT 2 -->
        <div class="robot-card">

            <div class="robot-head">
                <div class="robot-name">🤖 Robot 2</div>
                <div class="online">● Online</div>
            </div>

            <div class="controller">

                <button class="btn up"
                    onclick="sendCommand(2, 10, 10)">
                    ↑
                </button>

                <button class="btn left"
                    onclick="sendCommand(2, -10, 10)">
                    ←
                </button>

                <button class="btn stop"
                    onclick="sendCommand(2, 0, 0)">
                    STOP
                </button>

                <button class="btn right"
                    onclick="sendCommand(2, 10, -10)">
                    →
                </button>

                <button class="btn down"
                    onclick="sendCommand(2, -10, -10)">
                    ↓
                </button>

            </div>

            <div class="values">
                <div class="value-box">
                    <span class="value-title">LEFT MOTOR</span>
                    <span class="value-number" id="left2">0</span>
                </div>

                <div class="value-box">
                    <span class="value-title">RIGHT MOTOR</span>
                    <span class="value-number" id="right2">0</span>
                </div>
            </div>

        </div>


        <!-- ROBOT 3 -->
        <div class="robot-card">

            <div class="robot-head">
                <div class="robot-name">🤖 Robot 3</div>
                <div class="online">● Online</div>
            </div>

            <div class="controller">

                <button class="btn up"
                    onclick="sendCommand(3, 10, 10)">
                    ↑
                </button>

                <button class="btn left"
                    onclick="sendCommand(3, -10, 10)">
                    ←
                </button>

                <button class="btn stop"
                    onclick="sendCommand(3, 0, 0)">
                    STOP
                </button>

                <button class="btn right"
                    onclick="sendCommand(3, 10, -10)">
                    →
                </button>

                <button class="btn down"
                    onclick="sendCommand(3, -10, -10)">
                    ↓
                </button>

            </div>

            <div class="values">
                <div class="value-box">
                    <span class="value-title">LEFT MOTOR</span>
                    <span class="value-number" id="left3">0</span>
                </div>

                <div class="value-box">
                    <span class="value-title">RIGHT MOTOR</span>
                    <span class="value-number" id="right3">0</span>
                </div>
            </div>

        </div>

    </div>


    <button class="global-stop" onclick="stopAll()">
        ⛔ توقف همه ربات‌ها
    </button>

</div>

<div class="footer">
    RCJ Soccer Cheat • Robot Control Panel
</div>


<script>

async function sendCommand(robotId, left, right) {

    try {

        const response = await fetch(
            `/api/command/${robotId}`,
            {
                method: "POST",

                headers: {
                    "Content-Type": "application/json"
                },

                body: JSON.stringify({
                    left: left,
                    right: right
                })
            }
        );

        if (!response.ok) {
            console.log(
                "Server error:",
                response.status
            );
            return;
        }

        updateValues(robotId, left, right);

    } catch (error) {

        console.log(
            "Connection error:",
            error
        );

    }
}


function updateValues(robotId, left, right) {

    document.getElementById(
        "left" + robotId
    ).textContent = left;

    document.getElementById(
        "right" + robotId
    ).textContent = right;
}


async function stopAll() {

    try {

        const response = await fetch(
            "/api/stop",
            {
                method: "POST"
            }
        );

        if (!response.ok) {
            console.log(
                "Stop error:",
                response.status
            );
            return;
        }

        for (let i = 1; i <= 3; i++) {
            updateValues(i, 0, 0);
        }

    } catch (error) {

        console.log(
            "Connection error:",
            error
        );

    }
}

</script>

</body>
</html>
